plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pulsedesk.mobile'
    compileSdk 34

    defaultConfig {
        applicationId "com.pulsedesk.mobile"
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "2.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            // testing build: signed with the auto-generated debug key so the APK installs directly
            signingConfig signingConfigs.debug
        }
    }

    lint {
        abortOnError false
    }
}
